[package]
name = "bmm350-async"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Driver for the Bosch BMM350 magnetometer over I2C. Async and blocking, on embedded-hal traits only."
repository = "https://github.com/Lmx154/bmm350-rs"
readme = "README.md"
keywords = ["embedded", "no-std", "driver", "magnetometer", "bmm350"]
categories = ["embedded", "no-std", "hardware-support"]
rust-version = "1.99"
exclude = ["hil/", "tools/", "docs/", "proptest-regressions/", ".gitignore"]

[lib]
name = "bmm350"

[features]
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
defmt = { version = "1.0.1", optional = true }

[workspace]
exclude = ["hil"]

[dev-dependencies]
proptest = "1.12"
